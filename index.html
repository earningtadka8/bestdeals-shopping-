<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BestDeals Final</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#0f0f12;color:#fff;font-family:Arial;padding:10px;max-width:480px;margin:auto}
.info{background:#1e1e2f;padding:8px;border-radius:8px;text-align:center;font-size:12px;margin-bottom:10px;border:1px solid #6c5cff}
.wheel{width:180px;height:180px;border-radius:50%;margin:15px auto;border:4px solid #6c5cff;background:conic-gradient(#6a4cff 0 25%,#333 25% 50%,#6a4cff 50% 75%,#333 75% 100%);transition:transform 4s}
.btn{width:100%;background:#8b5cf6;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:bold}
.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0}
.tab{padding:7px 14px;background:#222;border-radius:20px;font-size:12px;white-space:nowrap}
.tab.active{background:#ffcc00;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{background:#1e1e1e;border-radius:8px;padding:6px;border:1px solid #333}
.prod img{width:100%;height:120px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>

<div class="info" id="info">15s Gap | <span id="adStatus">Ready</span> | Ads: <span id="adCount">0</span></div>
<div style="width:200px;height:200px;border-radius:50%;margin:10px auto;border:4px solid #6c5cff;position:relative;background:#222;display:flex;align-items:center;justify-content:center" id="wheel">SPIN</div>
<button class="btn" id="spinBtn" onclick="startSpin()">✨ SPIN - Monetag → Spin → Adsgram</button>
<div id="msg" style="text-align:center;color:#ffcc00;font-size:12px;margin:8px 0">Kahi bhi click = Monetag (15s gap)</div>

<div class="tabs">
<div class="tab active" onclick="filterCat('all',this)">All</div>
<div class="tab" onclick="filterCat('amazon',this)">Amazon</div>
<div class="tab" onclick="filterCat('flipkart',this)">Flipkart</div>
<div class="tab" onclick="filterCat('meesho',this)">Meesho</div>
</div>

<div id="products"></div>

<script>
let adCount=0, lastAd=0, isAd=false, monetagReady=false, adsgramReady=false, AdsBlock=null, spinning=false;

function loadMonetag(){
  return new Promise(r=>{
    if(monetagReady && typeof show_11968926==='function'){ r(true); return; }
    let s=document.createElement('script'); s.src='https://libtl.com/sdk.js'; s.dataset.zone='11968926'; s.dataset.sdk='show_11968926';
    s.onload=()=>{ monetagReady=true; r(true); }; s.onerror=()=>r(false); document.head.appendChild(s);
  });
}
function loadAdsgram(){
  return new Promise(r=>{
    if(adsgramReady && AdsBlock){ r(true); return; }
    let s=document.createElement('script'); s.src='https://sad.adsgram.ai/js/sad.min.js';
    s.onload=()=>{ try{ AdsBlock=window.Adsgram.init({blockId:"int-52779"}); adsgramReady=true; r(true); }catch(e){ r(false); } };
    s.onerror=()=>r(false); document.head.appendChild(s);
  });
}
async function monetag(src){
  if(isAd) return false;
  if(!monetagReady){ await loadMonetag(); await new Promise(x=>setTimeout(x,800)); }
  if(typeof show_11968926!=='function') return false;
  isAd=true; document.getElementById('msg').innerText='🎬 Monetag 15s ('+src+')...';
  return new Promise(res=>{
    show_11968926().then(()=>{ adCount++; isAd=false; lastAd=Date.now(); document.getElementById('adCount').innerText=adCount; document.getElementById('adStatus').innerText='Next in 15s'; res(true); }).catch(()=>{ isAd=false; res(false); });
  });
}
async function adsgram(){
  if(isAd) return false;
  if(!adsgramReady){ await loadAdsgram(); await new Promise(x=>setTimeout(x,500)); }
  if(!AdsBlock) return false;
  isAd=true; document.getElementById('msg').innerText='🎬 Adsgram 15s...';
  return new Promise(res=>{ AdsBlock.show().then(()=>{ adCount++; isAd=false; lastAd=Date.now(); document.getElementById('adCount').innerText=adCount; res(true); }).catch(()=>{ isAd=false; res(false); }); });
}

// GLOBAL CLICK 15s GAP
document.addEventListener('click', async e=>{
  if(e.target.closest('#spinBtn')) return;
  if(spinning || isAd) return;
  let now=Date.now(); if(now-lastAd<15000){ let l=Math.ceil((15000-(now-lastAd))/1000); document.getElementById('adStatus').innerText='Next in '+l+'s'; return; }
  await monetag('Click');
}, true);

// PRODUCTS - ORIGINAL LINKS
const TAG='earningtadka8-21';
let allProds=[
{name:"Men T-Shirt Pack 3", price:399, cat:"amazon", img:"https://m.media-amazon.com/images/I/41aQCWMtgdL._AC_.jpg", link:`https://www.amazon.in/s?k=men+tshirt+combo+pack&tag=${TAG}`},
{name:"Boat Airdopes 141", price:999, cat:"amazon", img:"https://m.media-amazon.com/images/I/51cQ8TCOYfL._AC_.jpg", link:`https://www.amazon.in/boAt-Airdopes-141-Bluetooth-Wireless/dp/B09N3ZLB3W?tag=${TAG}`},
{name:"Noise Smartwatch", price:1499, cat:"amazon", img:"https://m.media-amazon.com/images/I/61SSVxTSs4L._AC_.jpg", link:`https://www.amazon.in/s?k=noise+smartwatch&tag=${TAG}`},
{name:"Men Sneakers", price:599, cat:"flipkart", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/shoe/3/4/f/8-8-shoes-8-sports-8-.../original.jpg", link:"https://www.flipkart.com/search?q=sneakers+for+men"},
{name:"Boult Earbuds", price:899, cat:"flipkart", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/headphone/d/q/r/-original.jpg", link:"https://www.flipkart.com/search?q=boult+earbuds"},
{name:"Women Saree", price:499, cat:"flipkart", link:"https://www.flipkart.com/search?q=women+saree", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/sari/3/3/0/free-.../original.jpg"},
{name:"Men T-Shirt Meesho", price:299, cat:"meesho", link:"https://www.meesho.com/search?q=men+tshirt+combo", img:"https://images.meesho.com/images/products/123.../512.jpg"},
{name:"Women Kurti Set", price:349, cat:"meesho", link:"https://www.meesho.com/search?q=women+kurti+set", img:"https://images.meesho.com/images/products/456.../512.jpg"},
{name:"Jhumka Earrings", price:149, cat:"meesho", link:"https://www.meesho.com/search?q=jhumka+earrings", img:"https://images.meesho.com/images/products/321.../512.jpg"},
];

let curCat='all', extra=0;
function getF(){ return curCat==='all'? allProds : allProds.filter(p=>p.cat===curCat); }
function render(){
  let f=getF();
  document.getElementById('products').innerHTML='<div class="grid">'+f.map(p=>`
    <div class="prod" onclick="openLink('${p.link}')">
      <img src="${p.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=${p.cat}'">
      <div style="font-size:11px;margin:4px 0;height:30px;overflow:hidden">${p.name}</div>
      <div style="color:#0f0;font-weight:bold">₹${p.price-extra} <span style="font-size:9px;background:${p.cat==='amazon'?'#ff9900':p.cat==='flipkart'?'#2874f0':'#f43397'};color:#fff;padding:2px 6px;border-radius:10px">${p.cat.toUpperCase()}</span></div>
    </div>`).join('')+'</div>';
}
function filterCat(c, el){ curCat=c; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); render(); }
async function openLink(link){ await monetag('Product'); if(window.Telegram?.WebApp) Telegram.WebApp.openLink(link); else window.open(link,'_blank'); }

async function startSpin(){
  if(spinning) return; spinning=true; let b=document.getElementById('spinBtn'); b.disabled=true;
  b.innerText='⏳ Monetag Loading...'; await monetag('Wheel Start');
  document.getElementById('msg').innerText='🎡 Spinning...'; b.innerText='🎡 Spinning...';
  document.getElementById('wheel').style.transform='rotate('+(360*6+Math.random()*360)+'deg)';
  setTimeout(async()=>{
    let win=Math.random()<0.3; extra=win?5:0; document.getElementById('msg').innerText=win?'🎉 ₹5 OFF Won! - Adsgram...':'Try Again - Adsgram...';
    render(); b.innerText='⏳ Adsgram Loading...'; await adsgram();
    spinning=false; b.disabled=false; b.innerText='✨ SPIN - Monetag → Spin → Adsgram';
  },4000);
}

window.addEventListener('load',()=>{ try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){} render(); });
</script>
</body>
</html>
