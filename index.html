<style>
body{margin:0;background:#0f0f12;color:#fff;font-family:Arial;padding:12px;max-width:480px;margin:0 auto}
.app-bar{background:linear-gradient(90deg,#ffcc00,#f59e0b);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:0;z-index:99;border:1px solid #ffcc00}
.coin-bar{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #ffcc00;border-radius:12px;padding:10px;margin-bottom:12px;text-align:center;font-size:13px}
.info{background:#1f1f3a;border:1px solid #6c5cff;border-radius:10px;padding:10px;font-size:12px;text-align:center;margin-bottom:10px}
.wheel{width:220px;height:220px;border-radius:50%;margin:15px auto;position:relative;border:4px solid #6c5cff;background:conic-gradient(#6a4cff 0 70%, #333 70% 98%, #3b82f6 98% 99%, #22c55e 99% 99.5%, #06b6d4 99.5% 100%);transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:#000;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
.pin{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #ffcc00;margin:0 auto}
.btn{width:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);color:#fff;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;margin:10px 0;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.prod{background:#1e1e1e;border-radius:12px;padding:8px;border:1px solid #333;position:relative;cursor:pointer;transition:transform 0.2s}
.prod:active{transform:scale(0.97)}
.prod img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#fff}
.prod h4{font-size:11px;margin:6px 0;height:32px;overflow:hidden;line-height:1.3}
.price{color:#00ff88;font-weight:bold;font-size:13px}
.old{color:#777;font-size:10px;text-decoration:line-through;margin-left:4px}
.badge{position:absolute;top:8px;left:8px;font-size:8px;padding:3px 7px;border-radius:10px;font-weight:bold;z-index:2}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tab{padding:6px 14px;border-radius:20px;background:#1e1e1e;color:#fff;border:1px solid #333;white-space:nowrap;font-size:12px;cursor:pointer}
.tab.active{background:#ffcc00;color:#000;font-weight:bold}
</style>

<body>
<div class="app-bar">
<div style="color:#000;font-weight:bold;font-size:14px">📱 BestDeals App<br><span style="font-size:11px">Shop + Snake</span></div>

</div>

<div style="margin:16px 0;background:#1e293b;border:1px solid #22c55e;border-radius:16px;padding:14px">
<h3 style="margin:0;color:#22c55e">🐍 Snake Game</h3>
<canvas id="snakeCanvas" width="300" height="300" style="background:#0f172a;border-radius:12px;display:block;margin:10px auto;border:2px solid #22c55e"></canvas>
<div style="display:flex;justify-content:center;gap:8px"><button onclick="setDir(0,-1)" style="padding:10px 18px;border-radius:10px;border:0;background:#334155;color:#fff">↑</button></div>
<div style="display:flex;justify-content:center;gap:8px;margin-top:6px"><button onclick="setDir(-1,0)" style="padding:10px 18px;border-radius:10px;border:0;background:#334155;color:#fff">←</button><button onclick="startSnake()" style="padding:10px 18px;border-radius:10px;border:0;background:#22c55e;color:#000;font-weight:800">▶ Start</button><button onclick="setDir(1,0)" style="padding:10px 18px;border-radius:10px;border:0;background:#334155;color:#fff">→</button></div>
<div style="display:flex;justify-content:center;gap:8px;margin-top:6px"><button onclick="setDir(0,1)" style="padding:10px 18px;border-radius:10px;border:0;background:#334155;color:#fff">↓</button></div>
<div style="text-align:center;font-size:11px;color:#22c55e;margin-top:8px">Score: <b id="snakeScore">0</b> | High: <b id="snakeHigh">0</b></div>
</div>

<div style="margin:18px 0 16px;background:#1e293b;border:1px solid #ffcc00;border-radius:16px;padding:14px">
<h3 style="color:#ffcc00;margin:0 0 8px 0">🛍️ Best Deals</h3>
<div style="font-size:10px;color:#94a3b8;margin-bottom:10px">Tap on image to view deal • +1 Coin</div>
<div class="tabs">
<div class="tab active" id="f-all" onclick="filterShop('all')">All</div>
<div class="tab" id="f-amazon" onclick="filterShop('amazon')">Amazon</div>
<div class="tab" id="f-flipkart" onclick="filterShop('flipkart')">Flipkart</div>
<div class="tab" id="f-meesho" onclick="filterShop('meesho')">Meesho</div>
</div>
<div id="shoppingContainer" class="grid"></div>
</div>

<script>
let AdsBlock=null; try{ AdsBlock=window.Adsgram.init({blockId:"int-52779"}); }catch(e){}
let isSpinning=false, curShop='all', isSnakePlaying=false, nextSec=15, isAdRunning=false, autoStarted=false;
let coins=0, points=0, autoCount=0;
try{coins=parseInt(localStorage.getItem('coins')||'0');points=parseFloat(localStorage.getItem('points')||'0');autoCount=parseInt(localStorage.getItem('auto_count')||'0');}catch(e){}
function saveCoins(){ if(coins>=100){points+=Math.floor(coins/100);coins=coins%100;} try{localStorage.setItem('coins',coins);localStorage.setItem('points',points);localStorage.setItem('auto_count',autoCount);}catch(e){} document.getElementById('coins').innerText=coins; document.getElementById('points').innerText=points.toFixed(2); document.getElementById('autoCount').innerText=autoCount; }
saveCoins();

async function showMonetag(){ try{ if(typeof window.show_11968926==='function'){ await window.show_11968926(); return true; } for(let i=0;i<5;i++){ await new Promise(r=>setTimeout(r,500)); if(typeof window.show_11968926==='function'){ await window.show_11968926(); return true; } } }catch(e){} return false; }
async function showAdsgram(){ try{ if(!AdsBlock){ try{AdsBlock=window.Adsgram.init({blockId:"int-52779"});}catch(e){} } if(AdsBlock){ await AdsBlock.show(); return true; } }catch(e){} return false; }
async function runAutoAds(){ if(isAdRunning) return; isAdRunning=true; document.getElementById('nextAd').innerText="Loading Ads..."; let m=await showMonetag(); if(m){coins+=1;autoCount++;saveCoins();} await new Promise(r=>setTimeout(r,600)); let a=await showAdsgram(); if(a){coins+=1;autoCount++;saveCoins();} isAdRunning=false; nextSec=isSnakePlaying?180:15; }
function startAutoAdsSystem(){ if(autoStarted) return; autoStarted=true; setInterval(()=>{ nextSec--; if(nextSec<=0){ nextSec=isSnakePlaying?180:15; runAutoAds(); } let el=document.getElementById('nextAd'); if(el && !isAdRunning){ el.innerText=isSnakePlaying?Math.floor(nextSec/60)+'m '+nextSec%60+'s SNAKE':'Next: '+nextSec+'s'; } },1000); }
async function startSpin(){ if(isSpinning) return; isSpinning=true; startAutoAdsSystem(); let status=document.getElementById("result"); status.innerText="🎬 Monetag Ad..."; let m=await showMonetag(); if(m){coins+=1;autoCount++;saveCoins();} document.getElementById("wheel").style.transform=`rotate(${360*8+Math.random()*360}deg)`; status.innerText="🎡 Spinning..."; setTimeout(async()=>{ coins+=2; saveCoins(); status.innerText="🎬 Adsgram Ad..."; let a=await showAdsgram(); if(a){coins+=1;autoCount++;saveCoins();} status.innerText=`✅ +${2+(m?1:0)+(a?1:0)} Coins!`; isSpinning=false; },3200); }

const _t = "earningtadka8-21";
const SHOP_PRODUCTS=[
{n:"Scott T-Shirt Pack of 3",p:399,old:1049,cat:"amazon",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=400&fit=crop",l:"https://www.amazon.in/s?k=Scott+International+Tshirt&tag="+_t},
{n:"Symbol Men Polo T-Shirt",p:499,old:999,cat:"amazon",img:"https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=400&h=400&fit=crop",l:"https://www.amazon.in/s?k=Symbol+Men+Polo&tag="+_t},
{n:"Boat Airdopes 141 Wireless",p:999,old:2990,cat:"amazon",img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400&h=400&fit=crop",l:"https://www.amazon.in/s?k=boat+airdopes&tag="+_t},
{n:"Women Kurti Set Festive",p:599,old:1999,cat:"amazon",img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400&h=400&fit=crop",l:"https://www.amazon.in/s?k=kurti+set+women&tag="+_t},
{n:"Realme Narzo 70 Pro 5G",p:19999,old:25999,cat:"flipkart",img:"https://rukminim2.flixcart.com/image/416/416/xif0q/mobile/l/x/3/-original-imagyt8a8gxm5bmc.jpeg?q=70",l:"https://www.flipkart.com/search?q=realme+narzo+70+pro"},
{n:"Nike Mens Running Sneaker",p:1999,old:4999,cat:"flipkart",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/shoe/7/z/r/-original-imagh3tc5mxc3n5b.jpeg?q=70",l:"https://www.flipkart.com/search?q=nike+sneaker"},
{n:"Saree Cotton Printed",p:699,old:1999,cat:"flipkart",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/sari/3/r/a/free-1351-nis-hansh-unstitched-original-imagw6z7qj6p5hzk.jpeg?q=70",l:"https://www.flipkart.com/search?q=saree+cotton+printed"},
{n:"Women Kurti Plazo Set",p:349,old:999,cat:"meesho",img:"https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=400&h=400&fit=crop",l:"https://www.meesho.com/search?q=kurti+plazo+set"},
{n:"Gold Plated Jewellery Set",p:299,old:999,cat:"meesho",img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400&h=400&fit=crop",l:"https://www.meesho.com/search?q=jewellery+set+gold"},
{n:"Smart Watch Bluetooth",p:599,old:2999,cat:"meesho",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop",l:"https://www.meesho.com/search?q=smart+watch"},
];

function filterShop(c){ curShop=c; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); let fb=document.getElementById('f-'+c); if(fb) fb.classList.add('active'); renderShop(); }

function renderShop(){
  let list=curShop=='all'?SHOP_PRODUCTS:SHOP_PRODUCTS.filter(p=>p.cat==curShop);
  let cont=document.getElementById('shoppingContainer');
  let html='';
  for(let p of list){
    let badge=p.cat=='amazon'?'#ff9900':p.cat=='flipkart'?'#2874f0':'#f43397';
    html+=`<div class="prod" onclick="productClick('${p.l}')">
      <span class="badge" style="background:${badge}">${p.cat.toUpperCase()}</span>
      <img src="${p.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x400/ffffff/000000?text=${p.cat}'">
      <h4>${p.n}</h4>
      <div><span class="price">₹${p.p}</span><span class="old">₹${p.old}</span></div>
      <div style="margin-top:6px;background:${badge};color:#fff;text-align:center;padding:8px;border-radius:8px;font-weight:700;font-size:12px">View Deal +1 Coin</div>
    </div>`;
  }
  cont.innerHTML=html;
}

// IMAGE CLICK = MONETAG AD + OPEN LINK
async function productClick(link){
  coins+=1; autoCount++; saveCoins(); // +1 coin instant
  startAutoAdsSystem();
  document.getElementById('nextAd').innerText="Product Ad Loading...";
  let m = await showMonetag(); // PEHLE MONETAG AD
  if(m){ coins+=1; autoCount++; saveCoins(); }
  // AD KE BAAD AMAZON/FLIPKART KHULEGA
  if(window.Telegram&&Telegram.WebApp) Telegram.WebApp.openLink(link);
  else window.open(link,'_blank');
}

renderShop();

let snake=[],food={},dir={x:0,y:0},nextDir={x:0,y:0},score=0,high=0,gInt=null;
try{high=parseInt(localStorage.getItem('snake_high')||'0');}catch(e){}
function initSnake(){document.getElementById('snakeHigh').innerText=high;resetSnake();drawSnake();}
function resetSnake(){snake=[{x:10,y:10}];food={x:15,y:10};dir={x:0,y:0};nextDir={x:0,y:0};score=0;document.getElementById('snakeScore').innerText=score;if(gInt){clearInterval(gInt);gInt=null;}}
function startSnake(){ startAutoAdsSystem(); if(gInt) return; dir={x:1,y:0};nextDir={x:1,y:0}; gInt=setInterval(loop,120); isSnakePlaying=true; nextSec=180; }
function setDir(x,y){if(dir.x===-x&&dir.y===-y)return;nextDir={x:x,y:y};if(!gInt)startSnake();}
function loop(){ dir=nextDir; let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y}; if(h.x<0)h.x=19;if(h.x>=20)h.x=0;if(h.y<0)h.y=19;if(h.y>=20)h.y=0; if(snake.some(s=>s.x==h.x&&s.y==h.y)){gameOver();return;} snake.unshift(h); if(h.x==food.x&&h.y==food.y){ score+=10;document.getElementById('snakeScore').innerText=score; food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}; if(score>high){high=score;localStorage.setItem('snake_high',high);document.getElementById('snakeHigh').innerText=high;} }else snake.pop(); drawSnake(); }
function drawSnake(){let c=document.getElementById('snakeCanvas');let ctx=c.getContext('2d');ctx.fillStyle='#0f172a';ctx.fillRect(0,0,300,300);ctx.fillStyle='#22c55e';snake.forEach(s=>ctx.fillRect(s.x*15,s.y*15,14,14));ctx.fillStyle='#ef4444';ctx.fillRect(food.x*15,food.y*15,14,14);}
async function gameOver(){ clearInterval(gInt);gInt=null;isSnakePlaying=false;nextSec=15; if(score>=20){let r=score>=50?10:5;coins+=r;saveCoins();alert('Score '+score+' +'+r+' Coins!'); await runAutoAds(); }else alert('Score '+score); resetSnake();drawSnake(); }
window.onload=()=>{initSnake(); renderShop(); if(window.Telegram&&Telegram.WebApp){try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}} };
</script>
</body>
</html>
