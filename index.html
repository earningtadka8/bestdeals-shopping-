<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BestDeals - 15s Gap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://libtl.com/sdk.js" data-zone="11968926" data-sdk="show_11968926"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
body{margin:0;background:#0f0f12;color:#fff;font-family:Arial;padding:12px;max-width:480px;margin:0 auto}
.info{background:#1f1f3a;border:1px solid #6c5cff;border-radius:10px;padding:8px;font-size:11px;text-align:center;margin-bottom:8px}
.wheel{width:200px;height:200px;border-radius:50%;margin:12px auto;border:4px solid #6c5cff;background:conic-gradient(#6a4cff 0 70%, #333 70% 100%);transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:#000;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
.pin{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid #ffcc00;margin:0 auto}
.btn{width:100%;background:#8b5cf6;color:#fff;border:0;padding:12px;border-radius:10px;font-size:14px;font-weight:bold;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.prod{background:#1e1e1e;border-radius:10px;padding:6px;border:1px solid #333}
.prod img{width:100%;height:120px;object-fit:cover;border-radius:6px;background:#222}
.prod h4{font-size:10px;margin:4px 0;height:28px;overflow:hidden}
</style>
</head>
<body>

<div class="info" id="adInfo">15s Gap | Zone 11968926 | Site 7819768 ✅<br>Auto: <span id="nextAd" style="color:#ffcc00;font-weight:bold">Ready</span> | Count: <span id="adCount">0</span></div>
<div class="pin"></div>
<div style="position:relative"><div class="wheel" id="wheel"><div class="center">SPIN</div></div></div>
<button class="btn" id="spinBtn" onclick="startSpin()">✨ Wheel - Monetag 15s → Spin → Adsgram</button>
<div id="result" style="text-align:center;font-size:12px;margin:6px 0;color:#ffcc00">15s gap - Kahi click = Monetag</div>
<div id="productContainer"></div>

<script>
let AdsBlock=null, isAdRunning=false, adCount=0, lastGlobalClick=0, wheelSpinning=false;
try{ AdsBlock=window.Adsgram.init({blockId:"int-52779"}); }catch(e){}

function showMonetag(src="auto"){
  return new Promise((resolve)=>{
    if(isAdRunning){ resolve(false); return; }
    if(typeof show_11968926 !== 'function'){ resolve(false); return; }
    isAdRunning=true;
    document.getElementById('nextAd').innerText=`Monetag ${src} Loading...`;
    document.getElementById('result').innerText=`🎬 Monetag 15s (${src})...`;
    show_11968926().then(() => {
      adCount++; isAdRunning=false; lastGlobalClick=Date.now();
      document.getElementById('adCount').innerText=adCount;
      document.getElementById('nextAd').innerText=`✅ Done - Next in 15s`;
      resolve(true);
    }).catch(()=>{ isAdRunning=false; resolve(false); });
  });
}
function showAdsgram(){
  return new Promise((resolve)=>{
    if(isAdRunning){ resolve(false); return; }
    isAdRunning=true;
    try{
      AdsBlock.show().then(()=>{ adCount++; isAdRunning=false; lastGlobalClick=Date.now(); document.getElementById('adCount').innerText=adCount; resolve(true); }).catch(()=>{ isAdRunning=false; resolve(false); });
    }catch(e){ isAdRunning=false; resolve(false); }
  });
}

// GLOBAL CLICK - 15 SECOND GAP
document.addEventListener('click', async (e)=>{
  if(e.target.closest('#spinBtn')) return;
  if(wheelSpinning || isAdRunning) return;
  let now=Date.now();
  if(now - lastGlobalClick < 15000){
    let left=Math.ceil((15000-(now-lastGlobalClick))/1000);
    document.getElementById('nextAd').innerText=`Next in ${left}s`;
    return;
  }
  await showMonetag("Click");
}, true);

const _t="earningtadka8-21";
let allProducts=[
{name:"Scott T-Shirt Pack 3", price:399, old:1049, img:"https://m.media-amazon.com/images/I/41aQCWMtgdL._AC_.jpg", link:"https://www.amazon.in/s?k=Scott+International+Men+Tshirt&tag="+_t},
{name:"Boat Airdopes 141", price:999, old:2990, img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=200&h=200&fit=crop", link:"https://www.amazon.in/s?k=boat+airdopes&tag="+_t}
];
let spinExtra=0;
function renderProducts(){ document.getElementById("productContainer").innerHTML=`<div class="grid">`+allProducts.map(p=>{ let fp=p.price-spinExtra; let idx=allProducts.indexOf(p); return `<div class="prod" onclick="buyProduct(${idx})"><img src="${p.img}"><h4>${p.name}</h4><div style="color:#00ff88;font-weight:bold">₹${fp}</div></div>`; }).join('')+`</div>`; }
async function buyProduct(idx){ await showMonetag("Product"); window.open(allProducts[idx].link,"_blank"); }

async function startSpin(){
  if(wheelSpinning) return;
  wheelSpinning=true; let btn=document.getElementById('spinBtn'); btn.disabled=true;
  btn.innerText="⏳ Monetag 15s..."; await showMonetag("Wheel Start");
  document.getElementById('result').innerText="🎡 Spinning..."; btn.innerText="🎡 Spinning...";
  document.getElementById("wheel").style.transform=`rotate(${360*6+Math.random()*360}deg)`;
  setTimeout(async()=>{
    let win=Math.random()<0.3; spinExtra=win?5:0;
    document.getElementById('result').innerText=win?"🎉 ₹5 Won! - Adsgram...":"Try Again - Adsgram...";
    renderProducts(); btn.innerText="⏳ Adsgram After Spin..."; await showAdsgram();
    wheelSpinning=false; btn.disabled=false; btn.innerText="✨ Wheel - Monetag 15s → Spin → Adsgram";
  }, 4000);
}
window.addEventListener('load', ()=>{ try{ Telegram.WebApp.ready(); }catch(e){} renderProducts(); });
</script>
</body>
</html>
