<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Watch Ads - 20 List No Takkar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3ff;font-family:Arial;padding:12px;padding-bottom:90px;max-width:480px;margin:0 auto}
.top{background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.bal{background:#fff;border-radius:18px;padding:14px;display:flex;margin:12px 0}
.bal div{flex:1;text-align:center}.bal div:first-child{border-right:1px solid #e2e8f0}
.big{font-size:28px;font-weight:900}
.tasks{background:#fff;border-radius:18px;padding:14px;margin:12px 0}
.task{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #f1f5f9;border-radius:16px;margin:10px 0;background:#fafbff}
.task b{font-size:13px;color:#0f172a}
.task .left{display:flex;gap:12px;align-items:center}
.icon{width:48px;height:48px;border-radius:14px;background:#111;display:flex;align-items:center;justify-content:center;color:#ffcc00;font-weight:900;font-size:14px}
.open{background:#5b6cff;color:#fff;border:0;padding:12px 24px;border-radius:22px;font-weight:800;cursor:pointer}
.open:disabled{background:#94a3b8}
.nav{position:fixed;bottom:10px;left:12px;right:12px;max-width:456px;margin:0 auto;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,0.1);z-index:9999}
.nav div{padding:6px 18px;border-radius:16px;text-align:center;font-size:11px;color:#64748b}
.nav div.active{background:#2563eb;color:#fff}
</style>
</head>
<body>

<div class="top"><div style="display:flex;gap:10px;align-items:center"><div id="av" style="width:38px;height:38px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900">R</div><b id="uname">RAHUL</b></div><div style="display:flex;gap:10px"><div style="background:#f1f5f9;padding:8px 10px;border-radius:50%">❓</div><div style="background:#f1f5f9;padding:8px 10px;border-radius:50%">⚙️</div></div></div>

<div class="bal"><div><div style="font-size:11px;color:gray">🟡 COINS</div><div class="big" id="coins">20</div><div style="font-size:10px;color:#2563eb">+ 1 free flip</div></div><div><div style="font-size:11px;color:gray">💎 POINTS</div><div class="big" id="points">0.00</div><div style="font-size:10px" id="ton">≈ 0 TON | <span id="autoStatus">Tap to start Auto</span></div></div></div>

<div class="tasks">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Watch Ads - 20 List</h3><span style="background:#dcfce7;color:#15803d;padding:4px 8px;border-radius:10px;font-size:10px;font-weight:800">NO TAKKAR ✓</span></div>
  <div style="font-size:11px;color:gray;margin:6px 0">Har ad pe Monetag + Adsgram queue me | Refresh: <span id="timer">2:00:00</span> | <span id="adsInfo">0/15</span></div>
  <div id="taskList"></div>
</div>

<div class="nav"><div id="n-home" class="active">🏠<br>Home</div><div>🎮<br>Games</div><div>👛<br>Wallet</div><div>👥<br>Invite</div></div>

<script>
const ADS_20=[
 {id:1, title:"Free Poker, Real US...", coin:3, icon:"A9", color:"#111"},
 {id:2, title:"AI से बाज़ार को समझें", coin:3, icon:"AI", color:"#0f172a"},
 {id:3, title:"AI रखे बाज़ार पर नज़र", coin:3, icon:"AI", color:"#1e3a8a"},
 {id:4, title:"Shop & Earn 10x Cashback", coin:3, icon:"🛍️", color:"#ff9900"},
 {id:5, title:"Game Khelo Jeeto ₹500", coin:3, icon:"🎮", color:"#22c55e"},
 {id:6, title:"Amazon Deals Today", coin:3, icon:"🅰️", color:"#fff"},
 {id:7, title:"Boat Airdopes Offer", coin:3, icon:"🎧", color:"#111"},
 {id:8, title:"T-Shirt Combo 3 @399", coin:3, icon:"👕", color:"#e0f2fe"},
 {id:9, title:"Refer & Earn 20 Coins", coin:10, icon:"👥", color:"#dbeafe"},
 {id:10, title:"Watch Video +5 Bonus", coin:5, icon:"📺", color:"#fee2e2"},
 {id:11, title:"Spin Wheel Free Daily", coin:5, icon:"🎡", color:"#fef3c7"},
 {id:12, title:"Daily Checkin Bonus", coin:3, icon:"📅", color:"#dcfce7"},
 {id:13, title:"Invite Friend Bonus", coin:15, icon:"🎁", color:"#ede9fe"},
 {id:14, title:"Lucky Draw Entry Free", coin:4, icon:"🎰", color:"#ffedd5"},
 {id:15, title:"Flash Sale Live Now", coin:3, icon:"⚡", color:"#111"},
 {id:16, title:"Extra Cashback Offer", coin:3, icon:"💸", color:"#22c55e"},
 {id:17, title:"Free Delivery Today", coin:2, icon:"🚚", color:"#2563eb"},
 {id:18, title:"Trending Products Sale", coin:3, icon:"🔥", color:"#ef4444"},
 {id:19, title:"Big Billion Days Sale", coin:5, icon:"🛒", color:"#2874f0"},
 {id:20, title:"Festival Dhamaka Offer", coin:4, icon:"🪔", color:"#ff9900"}
];

let coins=parseInt(localStorage.getItem('coins')||'20');
let points=parseFloat(localStorage.getItem('points')||'0');
let adsToday=parseInt(localStorage.getItem('ads_today')||'0');
let adsLimit=15;
let resetTime=parseInt(localStorage.getItem('ads20_reset')||Date.now());
let userInteracted=false;
let isAdRunning=false; // ===== NO TAKKAR LOCK =====

function save(){
 if(coins>=100){ points+=Math.floor(coins/100); coins=coins%100; }
 localStorage.setItem('coins',coins); localStorage.setItem('points',points);
 document.getElementById('coins').innerText=coins;
 document.getElementById('points').innerText=points.toFixed(2);
 document.getElementById('ton').innerHTML='≈ '+(points*0.001).toFixed(4)+' TON | <span id="autoStatus">'+(userInteracted? (isAdRunning?'Ad Running...':'Auto ON') :'Tap to start')+'</span>';
 document.getElementById('adsInfo').innerText=adsToday+'/'+adsLimit;
}
function getTimeLeft(){
 let diff=(resetTime+2*60*60*1000)-Date.now();
 if(diff<=0){ adsToday=0; resetTime=Date.now(); localStorage.setItem('ads20_reset',resetTime); localStorage.setItem('ads_today','0'); diff=2*60*60*1000; renderTasks(); }
 let h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
 return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTasks(){
 document.getElementById('taskList').innerHTML=ADS_20.map(a=>`
  <div class="task" id="task-${a.id}">
    <div class="left">
      <div class="icon" style="background:${a.color}">${a.icon}</div>
      <div><b>${a.title}</b><div style="font-size:12px;color:#d4a017">🟡 +${a.coin}</div></div>
    </div>
    <button class="open" id="btn-${a.id}" onclick="watchDualAd(${a.id},${a.coin})">Open</button>
  </div>
 `).join('');
}

let AdsBlock=null, monetagReady=false;
try{ AdsBlock=window.Adsgram.init({blockId:"int-52779"}); }catch(e){}
document.addEventListener('click',()=>{userInteracted=true;},{once:true});
document.addEventListener('touchstart',()=>{userInteracted=true;},{once:true});

function loadMonetag(){
 return new Promise((res)=>{
  if(monetagReady && typeof show_11968926==='function'){res(true);return;}
  let s=document.createElement('script'); s.src='https://libtl.com/sdk.js'; s.dataset.zone='11968926'; s.dataset.sdk='show_11968926';
  s.onload=()=>{ let t=0; let iv=setInterval(()=>{t++; if(typeof show_11968926==='function'){monetagReady=true;clearInterval(iv);res(true);} if(t>20){clearInterval(iv);res(false);}},300); };
  s.onerror=()=>res(false);
  document.head.appendChild(s);
 });
}
async function showMonetag(){
 if(!monetagReady) await loadMonetag();
 if(typeof show_11968926!=='function') return false;
 try{ await show_11968926(); return true; }catch(e){ return false; }
}
async function showAdsgram(){
 try{ if(AdsBlock){ await AdsBlock.show(); return true; } }catch(e){}
 return false;
}

// ===== NO TAKKAR WALA DUAL ADS =====
async function watchDualAd(id, reward){
 if(isAdRunning){
   alert('Ek ad already chal raha hai, pehle usko complete hone do!');
   return;
 }
 if(adsToday>=adsLimit){ alert('15 ads limit khatam! Refresh: '+getTimeLeft()); return; }

 isAdRunning=true;
 let btn=document.getElementById('btn-'+id);
 btn.innerText='Ad 1/2...'; btn.disabled=true;
 userInteracted=true;
 save();

 let monetagDone=false, adsgramDone=false;

 // STEP 1 - Monetag
 try{ monetagDone = await showMonetag(); }catch(e){}
 
 btn.innerText='Ad 2/2...';
 await new Promise(r=>setTimeout(r,1000)); // 1 sec gap - takkar rokne ke liye

 // STEP 2 - Adsgram
 try{ adsgramDone = await showAdsgram(); }catch(e){}

 if(monetagDone || adsgramDone){
   coins+=reward; adsToday++; localStorage.setItem('ads_today',adsToday); save();
   btn.innerText='Done ✓'; btn.style.background='#22c55e';
   setTimeout(()=>{ document.getElementById('task-'+id).style.opacity='0.5'; btn.innerText='Claimed'; },800);
 }else{
   btn.innerText='Retry'; btn.disabled=false;
   alert('Ads slow hai - dobara try karo');
 }

 isAdRunning=false;
 save();
}

// AUTO - No Takkar
setInterval(async()=>{
 if(!userInteracted) return;
 if(isAdRunning) return; // User ka ad chal raha hai to auto ruko
 if(adsToday>=adsLimit) return;
 isAdRunning=true; save();
 let ok1=await showMonetag();
 await new Promise(r=>setTimeout(r,1000));
 let ok2=await showAdsgram();
 if(ok1||ok2){ coins+=1; save(); }
 isAdRunning=false; save();
},30000);

function loadUser(){ try{ if(window.Telegram?.WebApp){ let tg=Telegram.WebApp; tg.ready(); tg.expand(); let u=tg.initDataUnsafe?.user; if(u?.first_name){ document.getElementById('uname').innerText=u.first_name.toUpperCase(); } } }catch(e){} }
window.onload=()=>{
 loadUser(); save(); renderTasks();
 setInterval(()=>{ document.getElementById('timer').innerText=getTimeLeft(); },1000);
}
</script>
</body>
</html>
