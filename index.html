<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BestDeals - No Collision</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f12;color:#fff;font-family:system-ui;padding:10px;max-width:480px;margin:auto}
.i{background:#1e1e2f;padding:6px;border-radius:8px;text-align:center;font-size:11px;border:1px solid #6c5cff}
.w{width:160px;height:160px;border-radius:50%;margin:12px auto;border:4px solid #6c5cff;background:#222;display:flex;align-items:center;justify-content:center;transition:transform 4s}
.btn{width:100%;background:#8b5cf6;color:#fff;border:0;padding:12px;border-radius:8px;font-weight:bold}
.t{display:flex;gap:5px;overflow:auto;padding:8px 0}
.tb{padding:6px 12px;background:#222;border-radius:20px;font-size:11px;white-space:nowrap;cursor:pointer}
.tb.a{background:#ffcc00;color:#000;font-weight:bold}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p{background:#1e1e1e;border-radius:8px;padding:5px;border:1px solid #222}
.p img{width:100%;height:110px;object-fit:cover;border-radius:5px;background:#111}
</style>
</head>
<body>

<div class="i">NO COLLISION | <span id="s" style="color:#ffcc00;font-weight:bold">Ready</span> | Ads: <span id="c">0</span><br>Next: <span id="next" style="color:#00ff88">Monetag in 15s</span></div>
<div style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #ffcc00;margin:0 auto"></div>
<div class="w" id="w"><b>SPIN</b></div>
<button class="btn" id="b" onclick="spin()">✨ SPIN</button>
<div id="m" style="text-align:center;color:#ffcc00;font-size:11px;margin:6px 0;min-height:14px">No Collision - Ek khatam tabhi dusra</div>

<div class="t">
<div class="tb a" onclick="fil('all',this)">All 12</div>
<div class="tb" onclick="fil('amazon',this)">Amazon 4</div>
<div class="tb" onclick="fil('flipkart',this)">Flipkart 4</div>
<div class="tb" onclick="fil('meesho',this)">Meesho 4</div>
</div>

<div id="pr"></div>

<script>
let adC=0,last=0,busy=false,queue=false,mon=false,ads=false,AB=null,sp=false,nextIsMonetag=true,countdown=15;

function lM(){return new Promise(r=>{if(mon&&typeof show_11968926==='function'){r(1);return}let s=document.createElement('script');s.src='https://libtl.com/sdk.js';s.dataset.zone='11968926';s.dataset.sdk='show_11968926';s.onload=()=>{mon=true;r(1)};s.onerror=()=>r(0);document.head.appendChild(s)})}
function lA(){return new Promise(r=>{if(ads&&AB){r(1);return}let s=document.createElement('script');s.src='https://sad.adsgram.ai/js/sad.min.js';s.onload=()=>{try{AB=Adsgram.init({blockId:"int-52779"});ads=true;r(1)}catch(e){r(0)}};s.onerror=()=>r(0);document.head.appendChild(s)})}

async function mAd(src){
  if(busy||queue||sp) return false;
  queue=true;busy=true;
  document.getElementById('s').innerText='Monetag '+src+'...';
  if(!mon){await lM();await new Promise(z=>setTimeout(z,600))}
  if(typeof show_11968926!=='function'){busy=false;queue=false;return false}
  document.getElementById('m').innerText='🎬 Monetag '+src+'...';
  return new Promise(r=>{
    show_11968926().then(()=>{adC++;last=Date.now();busy=false;queue=false;countdown=15;document.getElementById('c').innerText=adC;document.getElementById('s').innerText='Done';r(true)}).catch(()=>{busy=false;queue=false;r(false)})
  })
}
async function aAd(src){
  if(busy||queue||sp) return false;
  queue=true;busy=true;
  document.getElementById('s').innerText='Adsgram '+src+'...';
  if(!ads){await lA();await new Promise(z=>setTimeout(z,400))}
  if(!AB){busy=false;queue=false;return false}
  document.getElementById('m').innerText='🎬 Adsgram '+src+'...';
  return new Promise(r=>{
    AB.show().then(()=>{adC++;last=Date.now();busy=false;queue=false;countdown=15;document.getElementById('c').innerText=adC;document.getElementById('s').innerText='Done';r(true)}).catch(()=>{busy=false;queue=false;r(false)})
  })
}

function startAuto(){
  setInterval(async()=>{
    if(busy||queue||sp) return; // TAKRAO BLOCK - KOI AD CHAL RAHA TO SKIP
    countdown--;
    if(countdown>0){
      document.getElementById('s').innerText='Next in '+countdown+'s';
      document.getElementById('next').innerText=(nextIsMonetag?'Monetag':'Adsgram')+' in '+countdown+'s';
    } else {
      if(nextIsMonetag){
        let ok=await mAd('Auto');
        if(ok){nextIsMonetag=false;document.getElementById('next').innerText='Adsgram in 15s'}
      } else {
        let ok=await aAd('Auto');
        if(ok){nextIsMonetag=true;document.getElementById('next').innerText='Monetag in 15s'}
      }
      countdown=15;
    }
  },1000);
}

document.addEventListener('click',async e=>{
  if(e.target.closest('#b')) return;
  if(sp||busy||queue) return;
  if(Date.now()-last<15000) return;
  await mAd('Click');
},true);

const TAG='earningtadka8-21';
let all=[
{name:"Scott Pack 3",price:399,cat:"amazon",img:"https://m.media-amazon.com/images/I/31I80jMir0L._SX180_.jpg",link:`https://www.amazon.in/s?k=Scott+Men+Tshirt+Pack&tag=${TAG}`},
{name:"Boat 141",price:999,cat:"amazon",img:"https://m.media-amazon.com/images/I/31QGk5+2ZJL._SX180_.jpg",link:`https://www.amazon.in/dp/B09N3ZLB3W?tag=${TAG}`},
{name:"Noise Watch",price:1499,cat:"amazon",img:"https://m.media-amazon.com/images/I/41d2IlY8r9L._SX180_.jpg",link:`https://www.amazon.in/s?k=noise+watch&tag=${TAG}`},
{name:"Symbol Polo",price:499,cat:"amazon",img:"https://m.media-amazon.com/images/I/41K7vW2t5hL._SX180_.jpg",link:`https://www.amazon.in/s?k=symbol+polo&tag=${TAG}`},
{name:"Sneakers White",price:599,cat:"flipkart",img:"https://via.placeholder.com/180/2874f0/fff?text=Sneakers",link:"https://www.flipkart.com/search?q=sneakers+men"},
{name:"Boult Z20",price:899,cat:"flipkart",img:"https://via.placeholder.com/180/2874f0/fff?text=Boult",link:"https://www.flipkart.com/search?q=boult+z20"},
{name:"Saree Silk",price:499,cat:"flipkart",img:"https://via.placeholder.com/180/2874f0/fff?text=Saree",link:"https://www.flipkart.com/search?q=saree+women"},
{name:"Hoodie Winter",price:699,cat:"flipkart",img:"https://via.placeholder.com/180/2874f0/fff?text=Hoodie",link:"https://www.flipkart.com/search?q=hoodie+men+winter"},
{name:"T-Shirt Combo",price:299,cat:"meesho",img:"https://via.placeholder.com/180/f43397/fff?text=T-Shirt",link:"https://www.meesho.com/search?q=tshirt+men"},
{name:"Kurti Set",price:349,cat:"meesho",img:"https://via.placeholder.com/180/f43397/fff?text=Kurti",link:"https://www.meesho.com/search?q=kurti+women"},
{name:"Jhumka Set",price:149,cat:"meesho",img:"https://via.placeholder.com/180/f43397/fff?text=Jhumka",link:"https://www.meesho.com/search?q=jhumka+earrings"},
{name:"Kids Dress",price:399,cat:"meesho",img:"https://via.placeholder.com/180/f43397/fff?text=Kids",link:"https://www.meesho.com/search?q=kids+dress"},
];

let cur='all',ex=0;
function getF(){return cur==='all'?all:all.filter(x=>x.cat===cur)}
function render(){
 let f=getF();
 document.getElementById('pr').innerHTML='<div class="g">'+f.map(p=>`
 <div class="p" onclick="go('${p.link}')">
 <img src="${p.img}" loading="lazy">
 <div style="font-size:10px;height:28px;overflow:hidden;margin:3px 0">${p.name}</div>
 <div style="color:#0f0;font-weight:bold">₹${p.price-ex} <span style="font-size:8px;background:${p.cat==='amazon'?'#f90':p.cat==='flipkart'?'#2874f0':'#f43397'};color:#fff;padding:1px 4px;border-radius:6px">${p.cat.toUpperCase()}</span></div>
 </div>`).join('')+'</div>';
}
function fil(c,el){cur=c;document.querySelectorAll('.tb').forEach(t=>t.classList.remove('a'));el.classList.add('a');render()}
async function go(l){
  if(busy||queue||sp) return;
  await mAd('Product');
  window.open(l,'_blank');
}
async function spin(){
 if(sp||busy||queue) return;
 sp=true; let b=document.getElementById('b'); b.disabled=true; b.innerText='⏳ Monetag...';
 await mAd('Wheel');
 document.getElementById('m').innerText='🎡 Spinning...'; b.innerText='🎡 Spinning...';
 document.getElementById('w').style.transform='rotate('+(360*6+Math.random()*360)+'deg)';
 setTimeout(async()=>{
   ex=Math.random()<0.3?5:0; render();
   b.innerText='⏳ Adsgram...'; await aAd('Wheel End');
   sp=false; b.disabled=false; b.innerText='✨ SPIN'; countdown=15;
 },3500);
}
render();
startAuto();
setTimeout(()=>{let s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';s.onload=()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}};document.head.appendChild(s)},1500);
</script>
</body>
  </html>
